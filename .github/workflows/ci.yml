name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64-gcc-asan,   os: ubuntu-24.04,     cmake: "-DSIAARA_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug" }
          - { name: linux-x64-clang,      os: ubuntu-24.04,     cmake: "-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release" }
          - { name: linux-arm64-gcc,      os: "${{ vars.LINUX_ARM64_RUNNER || 'ubuntu-24.04-arm' }}", cmake: "-DCMAKE_BUILD_TYPE=Release" }
          - { name: linux-x86-gcc,        os: ubuntu-24.04,     cmake: "-DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32", multilib: true }
          - { name: windows-x64-msvc,     os: windows-2022,     cmake: "-A x64" }
          - { name: windows-x86-msvc,     os: windows-2022,     cmake: "-A Win32" }
          - { name: windows-arm64-msvc,   os: "${{ vars.WINDOWS_ARM64_RUNNER || 'windows-11-arm' }}",   cmake: "-A ARM64" }
          - { name: macos-arm64,          os: macos-15,         cmake: "-DCMAKE_BUILD_TYPE=Release" }
          - { name: macos-x64,            os: macos-15-intel,   cmake: "-DCMAKE_BUILD_TYPE=Release" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Install 32-bit toolchain
        if: matrix.multilib
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib
      - name: Configure
        run: cmake -S . -B build ${{ matrix.cmake }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: TLS tests with the 32-bit system OpenSSL (loaded at run time)
        if: matrix.multilib
        run: |
          sudo dpkg --add-architecture i386 && sudo apt-get update && sudo apt-get install -y libssl3t64:i386
          build/tests/siaara_tests tls/
      - name: GPU tests on Mesa lavapipe (software Vulkan driver and spirv-val, test-only oracles)
        if: matrix.name == 'linux-x64-gcc-asan'
        run: |
          sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers spirv-tools
          build/tests/siaara_tests gpu/

  pydicom-crosscheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pydicom
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel
      - run: python tests/crosscheck/pydicom_crosscheck.py build/tools/siaara-dump

  standard-tables:
    # The generated tables must equal the generators' output for the pinned edition of the
    # standard (tools/ci/dicom_standard.json, SHA-256 checked): the data dictionary (PS3.6/PS3.7)
    # and the de-identification table (PS3.15 E.1-1, PS3.16 CID 7050). Fails on any drift.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Download the pinned DocBook XML
        run: python3 tools/ci/fetch_standard.py --out /tmp/dicom part06 part07 part15 part16
      - name: Dictionary matches the generator
        run: |
          python3 tools/gen_dictionary.py /tmp/dicom/part06.xml /tmp/dicom/part07.xml /tmp/dictionary_data.inc
          diff -u src/dict/dictionary_data.inc /tmp/dictionary_data.inc
      - name: De-identification table matches the generator (ctest deid_table_matches_generator)
        run: |
          cmake -S . -B build -DSIAARA_NEMA_PART15=/tmp/dicom/part15.xml -DSIAARA_NEMA_PART16=/tmp/dicom/part16.xml
          ctest --test-dir build -R deid_table_matches_generator --output-on-failure --no-tests=error

  commit-rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 50
      - name: No attribution trailers in commit messages
        run: |
          if git log -50 --format=%B | grep -Ei '^(Co-Authored-By|Claude-Session):|Generated with'; then
            echo "Commit messages must not contain attribution lines"; exit 1; fi

  tls-interop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Install oracles (DCMTK built with OpenSSL; openssl and curl command line tools)
        run: sudo apt-get update && sudo apt-get install -y dcmtk openssl curl
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel
      - name: OpenSSL is not linked at build time (loaded with dlopen when TLS is first used)
        run: |
          if readelf -d build/libsiaara.so | grep -E 'NEEDED.*(libssl|libcrypto)'; then exit 1; fi
          if readelf -d build/tools/siaara-echoscu | grep -E 'NEEDED.*(libssl|libcrypto)'; then exit 1; fi
      - name: TLS unit tests (throwaway certificates made with openssl at test time)
        run: build/tests/siaara_tests tls/
      - name: TLS interop with DCMTK (+tls), openssl s_client/s_server and curl
        run: python3 tests/crosscheck/tls_crosscheck.py --build build

  fuzz-smoke:
    # libFuzzer + ASan + UBSan, 60 s per target (targets run 4 at a time).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Install clang with the sanitizer and libFuzzer runtimes
        run: sudo apt-get update && sudo apt-get install -y clang-18 libclang-rt-18-dev
      - name: Configure
        run: >
          cmake -S . -B build-fuzz -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSIAARA_FUZZ=ON -DSIAARA_BUILD_TESTS=OFF -DSIAARA_BUILD_TOOLS=OFF
      - name: libFuzzer was found
        run: grep -q '^SIAARA_LIBFUZZER:INTERNAL=1' build-fuzz/CMakeCache.txt
      - name: Build
        run: cmake --build build-fuzz --parallel
      - name: Fuzz every target for 60 s
        run: python3 fuzz/run_fuzzers.py --bin build-fuzz/fuzz --seconds 60 --jobs 4 --hang-seconds 10 --rss-mb 2048 --work fuzz-work
      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: fuzz-smoke-findings
          path: |
            fuzz-work/*/artifacts/
            fuzz-work/*/fuzz.log
          if-no-files-found: ignore

  fuzz-asserts:
    # The fuzz targets again with assert() enabled (no NDEBUG): parser invariants such as "the
    # cursor never passes its parent" abort here instead of passing silently (R-051).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Install clang with the sanitizer and libFuzzer runtimes
        run: sudo apt-get update && sudo apt-get install -y clang-18 libclang-rt-18-dev
      - name: Configure (RelWithDebInfo without -DNDEBUG)
        run: >
          cmake -S . -B build-fuzz -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_BUILD_TYPE=RelWithDebInfo "-DCMAKE_C_FLAGS_RELWITHDEBINFO=-O1 -g" "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O1 -g"
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DSIAARA_FUZZ=ON -DSIAARA_BUILD_TESTS=OFF -DSIAARA_BUILD_TOOLS=OFF
      - name: Assertions are on
        run: |
          grep -q '^SIAARA_LIBFUZZER:INTERNAL=1' build-fuzz/CMakeCache.txt
          if grep -q -- '-DNDEBUG' build-fuzz/compile_commands.json; then echo "NDEBUG is defined"; exit 1; fi
      - name: Build
        run: cmake --build build-fuzz --parallel
      - name: Fuzz every target for 30 s
        run: python3 fuzz/run_fuzzers.py --bin build-fuzz/fuzz --seconds 30 --jobs 4 --hang-seconds 10 --rss-mb 2048 --work fuzz-work
      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: fuzz-asserts-findings
          path: |
            fuzz-work/*/artifacts/
            fuzz-work/*/fuzz.log
          if-no-files-found: ignore

  tsan:
    # ThreadSanitizer over the tests that run threads: DIMSE and DICOMweb loopback servers, the
    # store (concurrent adders/readers), the folder scanner, parallel frame decoding, volumes and
    # TLS (R-012; the system OpenSSL is not instrumented, but the 19 tls/ tests run clean without
    # suppressions as of 2026-11-10).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Lower ASLR entropy to what TSan's memory layout supports
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: >
          cmake -S . -B build-tsan -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSIAARA_TSAN=ON -DSIAARA_BUILD_TOOLS=OFF
      - name: Build
        run: cmake --build build-tsan --parallel --target siaara_tests
      - name: Threaded tests under TSan
        env:
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1 history_size=4
        run: |
          set -e
          for f in "net/" "web/loopback" "tls/" "store:" "scan:" "image: parallel" "volume"; do
            echo "::group::$f"
            build-tsan/tests/siaara_tests --data tests/data "$f"
            echo "::endgroup::"
          done

  dependency-allowlist:
    # Shipped binaries may depend only on OS libraries and the platform C/C++ runtime; on Linux the
    # system OpenSSL must not be linked (it is loaded with dlopen when TLS is first used).
    name: dependency-allowlist (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,   os: ubuntu-24.04,     lib: build/libsiaara.so,        tools: "build/tools/siaara-*", fortify: "--fortify" }
          - { name: linux-arm64, os: "${{ vars.LINUX_ARM64_RUNNER || 'ubuntu-24.04-arm' }}", lib: build/libsiaara.so,        tools: "build/tools/siaara-*", fortify: "--fortify" }
          - { name: macos,       os: macos-15,         lib: build/libsiaara.dylib,     tools: "build/tools/siaara-*" }
          - { name: windows-x64, os: windows-2022,     lib: build/Release/siaara.dll,  tools: "build/tools/Release/siaara-*.exe" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Put dumpbin on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $db = Get-ChildItem -Path "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          Add-Content -Path $env:GITHUB_PATH -Value $db.DirectoryName
      # Same configuration as the release workflow: static C/C++ runtime, hardening on.
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSIAARA_BUILD_TESTS=OFF -DSIAARA_STATIC_RUNTIME=ON
      - run: cmake --build build --config Release --parallel
      - name: Check runtime dependencies (release profile - no C/C++ runtime DLLs/shared objects)
        shell: bash
        run: python3 tools/ci/check_binaries.py deps --profile release ${{ matrix.lib }} ${{ matrix.tools }}
      - name: Check hardening (RELRO/BIND_NOW/NX/stack protector, FORTIFY; DYNAMICBASE/NX/CFG/CET)
        shell: bash
        run: python3 tools/ci/check_binaries.py hardening ${{ matrix.fortify }} ${{ matrix.lib }} ${{ matrix.tools }}

  exported-symbols:
    # Only the C API (siaara_*) may be exported, and the set must match tools/ci/abi/exported_symbols.txt.
    name: exported-symbols (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux,   os: ubuntu-24.04, lib: build/libsiaara.so }
          - { name: macos,   os: macos-15,     lib: build/libsiaara.dylib }
          - { name: windows, os: windows-2022, lib: build/Release/siaara.dll }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Put dumpbin on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $db = Get-ChildItem -Path "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          Add-Content -Path $env:GITHUB_PATH -Value $db.DirectoryName
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSIAARA_BUILD_TESTS=OFF -DSIAARA_BUILD_TOOLS=OFF
      - run: cmake --build build --config Release --parallel --target siaara
      - name: Compare with the baseline
        shell: bash
        run: python3 tools/ci/check_binaries.py symbols --header include/siaara/siaara.h ${{ matrix.lib }}

  workflow-pins:
    # Every third-party action must be pinned to a full commit SHA.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: No action referenced by tag or branch
        run: |
          if grep -rnE '^\s*(-\s*)?uses:\s*[^./][^@]*@' .github/workflows | grep -vE '@[0-9a-f]{40}(\s|$)'; then
            echo "Pin these actions to a full commit SHA"; exit 1; fi

  macos-asan:
    # Apple clang AddressSanitizer + UndefinedBehaviorSanitizer over the full test suite (R-012).
    # LeakSanitizer is not available with Apple clang on arm64, so leak detection stays off here
    # (the Linux ASan job covers it).
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSIAARA_SANITIZE=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  windows-asan:
    # MSVC AddressSanitizer (/fsanitize=address) over the full test suite.
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Put the MSVC tools (dumpbin, ASan runtime DLLs) on PATH
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $db = Get-ChildItem -Path "$vs\VC\Tools\MSVC" -Recurse -Filter clang_rt.asan_dynamic-x86_64.dll | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          Add-Content -Path $env:GITHUB_PATH -Value $db.DirectoryName
      - run: cmake -S . -B build -A x64 -DSIAARA_SANITIZE=ON
      - run: cmake --build build --config RelWithDebInfo --parallel
      - run: ctest --test-dir build -C RelWithDebInfo --output-on-failure

  clang-tidy:
    # Static analysis with the committed .clang-tidy; findings that predate the gate are listed in
    # tools/ci/clang_tidy_baseline.txt, anything new fails.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-18 clang-tidy-18
      - name: Configure (compile_commands.json)
        run: >
          cmake -S . -B build-tidy -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DSIAARA_BUILD_TESTS=OFF
      - name: clang-tidy over the library and tools
        run: run-clang-tidy-18 -p build-tidy -j 4 -quiet -clang-tidy-binary clang-tidy-18 "src/|tools/" > tidy.log 2>&1 || true
      - name: No findings beyond the committed baseline (tools/ci/clang_tidy_baseline.txt)
        run: python3 tools/ci/clang_tidy_gate.py tidy.log

  csharp:
    name: csharp-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1 (tag v4)
        with:
          dotnet-version: "10.0.x"
      - name: Build the native library and the struct-layout printer (Release)
        run: |
          cmake -S . -B build-rel -DCMAKE_BUILD_TYPE=Release
          cmake --build build-rel --config Release --parallel --target siaara siaara_csharp_struct_layout
      - name: Generated interop is up to date
        shell: bash
        run: |
          py=python3; command -v python3 >/dev/null || py=python
          $py tools/gen_csharp_interop.py --check
      - name: Build (warnings are errors) and run the C# test runner
        shell: bash
        run: |
          exe=build-rel/tests/siaara_csharp_struct_layout
          if [ -f build-rel/tests/Release/siaara_csharp_struct_layout.exe ]; then exe=build-rel/tests/Release/siaara_csharp_struct_layout.exe; fi
          dotnet run -c Release --project bindings/csharp/tests/Siaara.Tests -- --layout-exe "$exe"
      - name: NativeAOT publish of the sample, then run it
        if: runner.os == 'Linux'
        run: |
          dotnet publish bindings/csharp/samples/Siaara.AotSample -c Release -r linux-x64 -p:PublishAot=true -o aot-out
          ./aot-out/siaara-aot-sample
      - name: Pack (local package with this OS's native library)
        run: dotnet pack bindings/csharp/src/Siaara -c Release
