name: release

# On a version tag (v*): first a gate (the tagged commit is on main and ci.yml passed on it); then
# build Release for every platform of the CI matrix, run the full test
# suite on each, install, check the installed package with find_package(siaara) and pkg-config,
# check the runtime dependencies and hardening, package it reproducibly (archive + SPDX 2.3 SBOM +
# SHA-256), attest the build provenance; then collect the native libraries of every platform into
# ONE NuGet package (Siaara.<version>.nupkg, runtimes/<rid>/native) and test it offline; and create
# a DRAFT GitHub release with everything attached (a re-run refreshes that draft; a published
# release is never touched). The macOS universal archive is also tested natively on an Intel Mac
# (macos-intel-test). Provenance that survives the repository going private: the Sigstore bundle
# of every attestation and an SSH signature (secret SIAARA_RELEASE_SIGNING_KEY) of the archives,
# SHA256SUMS and the NuGet package are attached to the release. See docs/RELEASING.md and
# docs/RELEASE_CHECKLIST.md.
#
# A release candidate tag (vX.Y.Z-rc.N, X.Y.Z being the version of CMakeLists.txt) runs the same
# workflow as a rehearsal: the binaries are the X.Y.Z binaries, the archives and the NuGet package
# carry the label X.Y.Z-rc.N, and the draft is marked as a pre-release.
#
# The binaries and the NuGet package are NOT code signed (first release: internal consumers).
# docs/RELEASE_CHECKLIST.md says what changes when signing certificates exist.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  gate:
    # RL-02 / R-217: nothing is built for a tag unless the tagged commit is on main and the ci
    # workflow passed on exactly that commit.
    name: gate (on main, CI green)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read        # gh run list
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - name: The tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main: only a commit of main may be released"
            exit 1
          fi
          echo "$GITHUB_SHA is on main"
      - name: The ci workflow passed on that exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --json conclusion,status \
                 --jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length')
          if [ "${ok:-0}" -lt 1 ]; then
            echo "::error::no successful, completed run of ci.yml on $GITHUB_SHA: wait for CI to be green on that commit (or re-run it), then re-run this workflow"
            gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" || true
            exit 1
          fi
          echo "ci.yml passed on $GITHUB_SHA ($ok successful run(s))"

  build:
    name: ${{ matrix.platform }}
    needs: gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write      # build provenance attestation (Sigstore)
      attestations: write
    strategy:
      # RL-01: every platform runs to the end, so one run shows every failing platform. The release
      # is still blocked: nuget and draft-release need every leg.
      fail-fast: false
      matrix:
        # rid: the .NET runtime identifier(s) this platform's shared library is packed under in the
        # NuGet package (none for linux-x86: .NET has no 32-bit x86 Linux runtime).
        # hardening: arguments of tools/ci/check_binaries.py hardening, the same as the
        # dependency-allowlist job of ci.yml. linux-arm64 skips the BTI/PAC property note
        # (--no-cfi): the static C/C++ runtime of the runner drops it from the linked binary
        # (open item R-134; listed as a known limitation in CHANGELOG.md).
        include:
          - { platform: linux-x64,       os: ubuntu-24.04,     rid: "linux-x64",          hardening: "--fortify",          cmake: "-DCMAKE_BUILD_TYPE=Release" }
          - { platform: linux-x86,       os: ubuntu-24.04,     rid: "",                   hardening: "--fortify",          cmake: "-DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32", multilib: true }
          - { platform: linux-arm64,     os: "${{ vars.LINUX_ARM64_RUNNER || 'ubuntu-24.04-arm' }}", rid: "linux-arm64", hardening: "--fortify --no-cfi", cmake: "-DCMAKE_BUILD_TYPE=Release" }
          - { platform: windows-x64,     os: windows-2022,     rid: "win-x64",            hardening: "",                   cmake: "-A x64" }
          - { platform: windows-x86,     os: windows-2022,     rid: "win-x86",            hardening: "",                   cmake: "-A Win32" }
          - { platform: windows-arm64,   os: "${{ vars.WINDOWS_ARM64_RUNNER || 'windows-11-arm' }}", rid: "win-arm64", hardening: "", cmake: "-A ARM64" }
          - { platform: macos-universal, os: macos-15,         rid: "osx-x64 osx-arm64",  hardening: "",                   cmake: "-DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64' -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 1
      - name: Version, commit and SOURCE_DATE_EPOCH
        # The version has one source: the project(siaara VERSION x.y.z) line of CMakeLists.txt.
        # The tag must name it; the built library is checked against it after the install.
        # SIAARA_VERSION is that version (what the binaries report). LABEL is the tag without its "v":
        # the same for a release, "x.y.z-rc.N" for a release candidate; it names the archives,
        # the SBOMs and the NuGet package. (Not "VERSION": MSBuild reads environment variables as
        # properties, case-insensitively, and $(Version) would override the rc VersionSuffix.)
        run: |
          py=python3; command -v python3 >/dev/null || py=python
          version=$($py tools/release/version.py)
          $py tools/release/version.py --check-tag "$GITHUB_REF_NAME"
          echo "SIAARA_VERSION=$version" >> "$GITHUB_ENV"
          echo "LABEL=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Install 32-bit toolchain
        if: matrix.multilib
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib
      - name: Put dumpbin on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $db = Get-ChildItem -Path "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          Add-Content -Path $env:GITHUB_PATH -Value $db.DirectoryName
      - name: Configure
        run: cmake -S . -B build ${{ matrix.cmake }} -DSIAARA_REPRODUCIBLE=ON -DSIAARA_STATIC_RUNTIME=ON -DSIAARA_HARDENING=ON
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Test
        timeout-minutes: 60
        run: ctest --test-dir build -C Release --output-on-failure --timeout 1800
      - name: Test the x86_64 slice under Rosetta (universal macOS build)
        if: runner.os == 'macOS'
        timeout-minutes: 60
        run: |
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 build/tests/siaara_tests --data tests/data
          else
            echo "::error::Rosetta is not available on this runner: the x86_64 slice cannot be tested"
            exit 1
          fi
          lipo -archs build/libsiaara.dylib | grep -q x86_64
          lipo -archs build/libsiaara.dylib | grep -q arm64
      - name: Install
        run: cmake --install build --config Release --prefix "stage/siaara-$LABEL-${{ matrix.platform }}"
      - name: The installed package works with find_package(siaara) and has the tagged version
        # tools/release/check_installed.sh: the same check runs in macos-intel-test.
        run: bash tools/release/check_installed.sh consumer "$PWD/stage/siaara-$LABEL-${{ matrix.platform }}" "$SIAARA_VERSION" ${{ matrix.cmake }}
      - name: The shipped examples build against the installed package and run
        run: bash tools/release/check_installed.sh examples "$PWD/stage/siaara-$LABEL-${{ matrix.platform }}" ${{ matrix.cmake }}
      - name: The installed pkg-config file works (Linux x64 and ARM64)
        if: runner.os == 'Linux' && !matrix.multilib
        run: |
          prefix="$PWD/stage/siaara-$LABEL-${{ matrix.platform }}"
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
          test "$(pkg-config --modversion siaara)" = "$SIAARA_VERSION"
          cc -std=c11 tests/package/main.c $(pkg-config --cflags --libs siaara) -o build-consumer/consumer_pkgconfig
          LD_LIBRARY_PATH="$prefix/lib" build-consumer/consumer_pkgconfig
      - name: Runtime dependencies of the shipped binaries
        run: |
          prefix="stage/siaara-$LABEL-${{ matrix.platform }}"
          python3 tools/ci/check_binaries.py deps --profile release $(find "$prefix/bin" "$prefix/lib" -type f \( -name '*.dll' -o -name '*.exe' -o -name '*.so*' -o -name '*.dylib' -o -perm -u+x \) ! -name '*.cmake' ! -name '*.a' ! -name '*.lib' ! -name '*.pc')
      - name: Hardening of the shipped binaries
        run: |
          prefix="stage/siaara-$LABEL-${{ matrix.platform }}"
          python3 tools/ci/check_binaries.py hardening ${{ matrix.hardening }} $(find "$prefix/bin" "$prefix/lib" -type f \( -name '*.dll' -o -name '*.exe' -o -name '*.so*' -o -name '*.dylib' -o -perm -u+x \) ! -name '*.cmake' ! -name '*.a' ! -name '*.lib' ! -name '*.pc')
      - name: Exported symbols match the ABI baseline
        run: |
          prefix="stage/siaara-$LABEL-${{ matrix.platform }}"
          lib=$(find "$prefix" -type f \( -name 'libsiaara.so' -o -name 'libsiaara.dylib' -o -name 'siaara.dll' \) | head -1)
          python3 tools/ci/check_binaries.py symbols --header include/siaara/siaara.h "$lib"
      - name: Native library for the NuGet package (runtimes/<rid>/native)
        # The tested, installed shared library, unchanged. macOS: the universal library goes under
        # both osx-x64 and osx-arm64 (the file that was tested; no lipo -thin).
        if: matrix.rid != ''
        run: |
          prefix="stage/siaara-$LABEL-${{ matrix.platform }}"
          lib=$(find "$prefix" -type f \( -name 'libsiaara.so' -o -name 'libsiaara.dylib' -o -name 'siaara.dll' \) | head -1)
          for rid in ${{ matrix.rid }}; do
            mkdir -p "native/$rid"
            cp "$lib" "native/$rid/"
          done
          find native -type f
      - name: Package (archive, SBOM, checksums)
        run: >
          python3 tools/release/package.py --stage "stage/siaara-$LABEL-${{ matrix.platform }}"
          --version "$LABEL" --platform ${{ matrix.platform }} --commit "$COMMIT" --out dist
      - name: The archive holds what a release must hold, and nothing else
        run: python3 tools/release/check_archive.py dist/siaara-$LABEL-${{ matrix.platform }}.* --platform ${{ matrix.platform }}
      - name: Attest build provenance
        # Attestations need a public repository or GitHub Enterprise Cloud: on a private repository
        # without it this step reports the failure but does not stop the release.
        id: attest
        continue-on-error: ${{ github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.spdx.json
      - name: Attestation bundle next to the archive (verifiable offline, also once the repository is private)
        # RL-05 / R-209 / RL-06. One bundle covers the archive and its SBOM.
        env:
          ATTEST_OUTCOME: ${{ steps.attest.outcome }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          out="dist/siaara-$LABEL-${{ matrix.platform }}.sigstore.json"
          if [ "$ATTEST_OUTCOME" = "success" ] && [ -n "$BUNDLE" ] && [ -s "$BUNDLE" ]; then
            cp "$BUNDLE" "$out"
            python3 -c "import json, sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$out"
            echo "attestation bundle: $out"
          else
            echo "::warning::no build provenance attestation was made for siaara-$LABEL-${{ matrix.platform }} (attest step: $ATTEST_OUTCOME); the release notes will say so"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: matrix.rid != ''
        with:
          name: native-${{ matrix.platform }}
          path: native/
          if-no-files-found: error

  macos-intel-test:
    # RL-03: the macOS universal archive, unpacked as a consumer gets it, on an Intel Mac: the
    # x86_64 slice runs natively (the build leg runs it under Rosetta). Same checks as the build
    # leg runs on its installed tree (tools/release/check_installed.sh), built for x86_64 only.
    name: macos-x64 (Intel) on the universal archive
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 1
      - name: Version
        run: |
          version=$(python3 tools/release/version.py)
          python3 tools/release/version.py --check-tag "$GITHUB_REF_NAME"
          { echo "SIAARA_VERSION=$version"; echo "LABEL=${GITHUB_REF_NAME#v}"; } >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist-macos-universal
          path: dist
      - name: Unpack the archive (checksum first; the runner is an Intel Mac)
        run: |
          if [ "$(uname -m)" != "x86_64" ]; then
            echo "::error::macos-15-intel runner is $(uname -m), not x86_64"; exit 1
          fi
          (cd dist && shasum -a 256 -c "siaara-$LABEL-macos-universal.sha256")
          mkdir unpacked
          tar -xzf "dist/siaara-$LABEL-macos-universal.tar.gz" -C unpacked
          lib="unpacked/siaara-$LABEL-macos-universal/lib/libsiaara.dylib"
          lipo -archs "$lib"
          lipo -archs "$lib" | grep -q x86_64
          echo "PREFIX=$PWD/unpacked/siaara-$LABEL-macos-universal" >> "$GITHUB_ENV"
      - name: The unpacked package works with find_package(siaara) and has the tagged version (x86_64)
        run: bash tools/release/check_installed.sh consumer "$PREFIX" "$SIAARA_VERSION" -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
      - name: The shipped examples build against the unpacked package and run (x86_64)
        run: bash tools/release/check_installed.sh examples "$PREFIX" -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0

  nuget:
    # ONE NuGet package for .NET consumers: the managed assemblies (built here, once) and the
    # native library of every platform job under runtimes/<rid>/native. The package has no
    # dependencies, and a consumer restores it without any feed (tested below, offline).
    name: nuget
    needs: [build, macos-intel-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1 (tag v4)
        with:
          global-json-file: global.json   # the exact SDK, pinned in the repository
      - name: Version and SOURCE_DATE_EPOCH
        # SIAARA_VERSION, never VERSION: dotnet pack below reads the environment as MSBuild
        # properties, and VERSION=x.y.z would set $(Version) and drop the rc VersionSuffix.
        run: |
          version=$(python3 tools/release/version.py)
          python3 tools/release/version.py --check-tag "$GITHUB_REF_NAME"
          echo "SIAARA_VERSION=$version" >> "$GITHUB_ENV"
          echo "LABEL=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "SUFFIX=$(python3 tools/release/version.py --tag-suffix "$GITHUB_REF_NAME")" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: native-*
          path: native
          merge-multiple: true
      - name: Pack
        # The managed projects are IsTrimmable / IsAotCompatible, so the SDK fetches its analyzer
        # pack Microsoft.NET.ILLink.Tasks from nuget.org for this build - an SDK component fetched
        # on the release machine only (never vendored, never a dependency of the package; the
        # consumer test below proves a consumer needs nothing but the package). Anything else in
        # the package folder fails the job.
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/nuget-packages
        run: |
          dotnet pack bindings/csharp/src/Siaara -c Release -o dist \
            -p:ContinuousIntegrationBuild=true -p:SiaaraNativeArtifactsDir="$PWD/native" -p:VersionSuffix="$SUFFIX"
          ls -l dist
          if [ ! -f "dist/Siaara.$LABEL.nupkg" ]; then
            echo "::error::dotnet pack did not produce dist/Siaara.$LABEL.nupkg (package version wrong? an environment variable named like an MSBuild property, such as VERSION, overrides VersionSuffix)"
            ls -l dist
            exit 1
          fi
          echo "fetched for the build:"; ls "$NUGET_PACKAGES"
          extra=$(ls "$NUGET_PACKAGES" | grep -v '^microsoft.net.illink.tasks$' || true)
          if [ -n "$extra" ]; then echo "packages fetched that are not the SDK's ILLink analyzer pack: $extra"; exit 1; fi
      - name: The package holds every runtime, the licence, the readme and the XML documentation
        run: python3 tools/release/check_nupkg.py "dist/Siaara.$LABEL.nupkg" --version "$LABEL" --require-all-rids
      - name: A consumer restores it from a local folder feed, builds and runs (offline, linux-x64)
        env:
          # Env keys are case-insensitive to GitHub (a duplicate rejects the whole workflow), so the
          # lower-case proxy variables are exported in the script instead.
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
        run: |
          export http_proxy="$HTTP_PROXY" https_proxy="$HTTPS_PROXY" no_proxy=""
          python3 tools/release/check_nupkg.py "dist/Siaara.$LABEL.nupkg" --version "$LABEL" --consumer-test "$RUNNER_TEMP/nupkg-consumer"
      - name: Checksum
        run: |
          cd dist
          sha256sum "Siaara.$LABEL.nupkg" > "Siaara.$LABEL.nupkg.sha256"
          cat "Siaara.$LABEL.nupkg.sha256"
      - name: SSH release signature of the package (secret SIAARA_RELEASE_SIGNING_KEY)
        # RL-05 / R-209: a signature that anyone holding the public line of .github/release-signers
        # can check, with or without GitHub. Without the secret: a warning, no signature.
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.SIAARA_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then echo "::warning::SIAARA_RELEASE_SIGNING_KEY is not set: no SSH signature"; exit 0; fi
          umask 077; key="$RUNNER_TEMP/release_key"; printf '%s\n' "$RELEASE_SIGNING_KEY" | tr -d '\r' > "$key"
          rm -f "dist/Siaara.$LABEL.nupkg.sig"
          ssh-keygen -Y sign -f "$key" -n siaara-release "dist/Siaara.$LABEL.nupkg"; rm -f "$key"
          if [ ! -f .github/release-signers ]; then
            echo "::warning::.github/release-signers is not in the repository: the signature was made but not verified"
            exit 0
          fi
          ssh-keygen -Y verify -f .github/release-signers -I release@siaara -n siaara-release -s "dist/Siaara.$LABEL.nupkg.sig" < "dist/Siaara.$LABEL.nupkg"
      - name: Attest build provenance
        id: attest
        continue-on-error: ${{ github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*.nupkg
      - name: Attestation bundle next to the package (verifiable offline, also once the repository is private)
        env:
          ATTEST_OUTCOME: ${{ steps.attest.outcome }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          out="dist/Siaara.$LABEL.nupkg.sigstore.json"
          if [ "$ATTEST_OUTCOME" = "success" ] && [ -n "$BUNDLE" ] && [ -s "$BUNDLE" ]; then
            cp "$BUNDLE" "$out"
            python3 -c "import json, sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$out"
            echo "attestation bundle: $out"
          else
            echo "::warning::no build provenance attestation was made for Siaara.$LABEL.nupkg (attest step: $ATTEST_OUTCOME); the release notes will say so"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist-nuget
          path: dist/
          if-no-files-found: error

  draft-release:
    needs: [build, nuget, macos-intel-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write      # create or refresh the draft release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Combined checksum file
        run: |
          cd dist
          cat *.sha256 | sort -k2 > SHA256SUMS
          sha256sum -c SHA256SUMS
          rm -f *.sha256
          ls -l
      - name: SSH release signatures of the archives and SHA256SUMS (secret SIAARA_RELEASE_SIGNING_KEY)
        # The package was signed in the nuget job; SHA256SUMS exists only here, so the archives and
        # SHA256SUMS are signed here. Without the secret: a warning, no signatures.
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.SIAARA_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then echo "::warning::SIAARA_RELEASE_SIGNING_KEY is not set: no SSH signature"; exit 0; fi
          umask 077; key="$RUNNER_TEMP/release_key"; printf '%s\n' "$RELEASE_SIGNING_KEY" | tr -d '\r' > "$key"
          trap 'rm -f "$key"' EXIT
          verify=1
          if [ ! -f .github/release-signers ]; then
            echo "::warning::.github/release-signers is not in the repository: the signatures are made but not verified"
            verify=0
          fi
          shopt -s nullglob
          for f in dist/siaara-*.tar.gz dist/siaara-*.zip dist/SHA256SUMS; do
            rm -f "$f.sig"   # ssh-keygen would ask before overwriting one
            ssh-keygen -Y sign -f "$key" -n siaara-release "$f"
            if [ "$verify" = 1 ]; then
              ssh-keygen -Y verify -f .github/release-signers -I release@siaara -n siaara-release -s "$f.sig" < "$f"
            fi
          done
      - name: Release notes from CHANGELOG.md, with the provenance and signature status
        # RL-06: when an attestation could not be made (private repository without GitHub Enterprise
        # Cloud) or a file is not SSH-signed, the notes say so near the top.
        run: |
          python3 tools/release/version.py --release-notes "${GITHUB_REF_NAME#v}" --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" > notes-base.md
          label="${GITHUB_REF_NAME#v}"
          shopt -s nullglob
          no_bundle=() no_sig=()
          for a in dist/siaara-*.tar.gz dist/siaara-*.zip; do
            base=$(basename "$a"); base=${base%.tar.gz}; base=${base%.zip}
            [ -f "dist/$base.sigstore.json" ] || no_bundle+=("$(basename "$a")")
            [ -f "$a.sig" ] || no_sig+=("$(basename "$a")")
          done
          [ -f "dist/Siaara.$label.nupkg.sigstore.json" ] || no_bundle+=("Siaara.$label.nupkg")
          [ -f "dist/Siaara.$label.nupkg.sig" ] || no_sig+=("Siaara.$label.nupkg")
          [ -f dist/SHA256SUMS.sig ] || no_sig+=("SHA256SUMS")
          {
            echo "**Provenance and signatures.** Attached, except where listed below: a Sigstore attestation bundle (\`*.sigstore.json\`) for each archive (it also covers its SBOM) and for the NuGet package, and an SSH signature (\`*.sig\`, namespace \`siaara-release\`, signer \`release@siaara\`) of each archive, \`SHA256SUMS\` and the package; how to check them: docs/RELEASING.md, \"Verifying a release\"."
            if [ ${#no_bundle[@]} -gt 0 ]; then
              echo
              echo "**No build provenance attestation was made for:** ${no_bundle[*]} (the attestation step failed or is not available: private repository without GitHub Enterprise Cloud)."
            fi
            if [ ${#no_sig[@]} -gt 0 ]; then
              echo
              echo "**Not SSH-signed:** ${no_sig[*]} (the secret SIAARA_RELEASE_SIGNING_KEY was not set)."
            fi
            echo
          } > notes-provenance.md
          if [ ${#no_bundle[@]} -gt 0 ]; then echo "::warning::no attestation for: ${no_bundle[*]}"; fi
          if [ ${#no_sig[@]} -gt 0 ]; then echo "::warning::no SSH signature for: ${no_sig[*]}"; fi
          # The first paragraph of the notes (the "Draft release of ..." line) stays first.
          awk 'NR==FNR { prov = prov $0 "\n"; next } { print } FNR==2 && !done { printf "%s", prov; done=1 }' \
            notes-provenance.md notes-base.md > release-notes.md
          cat release-notes.md
      - name: Create the draft release, or refresh the draft of an earlier run
        # RL-04. A release for the tag that is still a draft: re-upload every file (replacing those
        # of the same name) and replace the notes. A published release: nothing is touched, the job
        # fails. No release: create the draft.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          state=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2> view.err)
          rc=$?
          set -e
          if [ "$rc" = 0 ] && [ "$state" = "true" ]; then
            echo "A draft release for $GITHUB_REF_NAME exists: refreshing its files and notes"
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/*
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          elif [ "$rc" = 0 ]; then
            echo "::error::the release $GITHUB_REF_NAME is already published: it is not changed. A published release is never replaced; release a new version (or the next -rc.N)."
            exit 1
          elif grep -qi "release not found" view.err; then
            prerelease=""
            case "$GITHUB_REF_NAME" in *-rc.*) prerelease="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag $prerelease \
              --title "SIAARA DICOM Toolkit ${GITHUB_REF_NAME#v}" \
              --notes-file release-notes.md \
              dist/*
          else
            cat view.err
            echo "::error::could not find out whether a release for $GITHUB_REF_NAME exists"
            exit 1
          fi
