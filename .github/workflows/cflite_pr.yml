name: clusterfuzzlite-pr

# ClusterFuzzLite (https://google.github.io/clusterfuzzlite/) on pull requests: builds the
# fuzz targets in .clusterfuzzlite/ (OSS-Fuzz compatible) and fuzzes the code the PR touches.
# Test infrastructure only; nothing from it ships.

on:
  pull_request:
    paths: ["src/**", "fuzz/**", "include/**", "CMakeLists.txt", ".clusterfuzzlite/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cflite-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read        # corpus and coverage from earlier runs (stored as artifacts)
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      - name: Build fuzzers (${{ matrix.sanitizer }})
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1  # v1
        with:
          language: c++
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: ${{ matrix.sanitizer }}
      - name: Run fuzzers (${{ matrix.sanitizer }})
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1  # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: code-change
          sanitizer: ${{ matrix.sanitizer }}
