name: codeql

# CodeQL static analysis of the C/C++ code (security-extended queries). Results go to the
# repository's code scanning alerts. On a private repository this needs GitHub Advanced Security;
# without it the job is skipped unless the repository variable CODEQL_ENABLED is 'true'.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    if: ${{ !github.event.repository.private || vars.CODEQL_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write   # upload the results
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
      - name: Build
        # The library and the tools only: the tests are not shipped code. A bounded -j: a bare
        # --parallel lets make start every compile at once, and ~90 traced compiles ran the
        # runner out of memory (it was shut down mid-build).
        timeout-minutes: 75
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSIAARA_BUILD_TESTS=OFF -DSIAARA_BUILD_TOOLS=ON
          cmake --build build --parallel 2
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          category: /language:c-cpp
